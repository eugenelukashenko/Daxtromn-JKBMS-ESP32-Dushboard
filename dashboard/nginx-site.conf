# /etc/nginx/sites-available/dashboard  (потім: ln -s у sites-enabled, nginx -t && systemctl reload nginx)
server {
    listen 8077;
    server_name _;

    root /var/www/dashboard;     # сюди скопіювати index.html, config.js, mqtt.min.js
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # API обліку мережі (сервіс grid_collector на цьому ж сервері)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # MQTT через WebSocket до брокера на 10.100.202.5 (порт 9001)
    location = /mqtt {
        proxy_pass http://10.100.202.5:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
