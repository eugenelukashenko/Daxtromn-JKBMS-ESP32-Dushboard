# Mosquitto на QNAP (Docker), 10.100.202.5 — /share/Container/mosquitto/config/mosquitto.conf
persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

# WebSocket для браузера (дашборд ходит сюда через nginx /mqtt)
listener 9001
protocol websockets
